[advisories]
version = 2
yanked = "deny"
ignore = [
  # unmaintained
  "RUSTSEC-2026-0374", # basic-toml
  "RUSTSEC-2026-0543", # chrono
  "RUSTSEC-2026-0542", # humantime
  "RUSTSEC-2024-0436", # paste，cel-interpreter 0.10 的编译期依赖
  "RUSTSEC-2024-0449", # unsafe-libyaml，serde_yaml 0.9 的依赖
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
  "AGPL-3.0-or-later",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
