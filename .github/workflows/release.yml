name: Release

on:
  push:
    tags:
      - "*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: '版本号（须有 doc/changelog/<版本号>.md）；留空则使用所选 ref'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Check version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "tuack-ng") | .version')
          if [ "$version" != "$TAG" ]; then
            echo "标签 $TAG 与 tuack-ng 的版本 $version 不一致" >&2
            exit 1
          fi
          echo "版本 $version"

      - uses: actions/upload-artifact@v4
        with:
          name: release-docs
          path: doc/changelog/${{ github.event.inputs.tag || github.ref_name }}.md
          if-no-files-found: error
          retention-days: 7

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  release:
    name: release
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: .

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            ./output-linux-deb-*/*.deb
            ./output-linux-zip-*/*.zip
            ./output-windows-*/*.zip
          body_path: ./release-docs/${{ github.event.inputs.tag || github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
