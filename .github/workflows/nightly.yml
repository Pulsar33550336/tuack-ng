name: Nightly

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # 没有新提交时跳过，省掉一次完整构建。
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for new commits
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/nightly-check.sh nightly.yml >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml

  publish:
    name: publish
    needs: [check, build]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: .

      - name: Publish nightly
        uses: andelf/nightly-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: nightly
          name: 'Nightly @ $$'
          prerelease: true
          body: |
            > [!caution]
            >
            > # 警告！请不要使用该版本！
            >
            > 这是从 `master` 自动构建的 Nightly 版本，可能极不稳定且不向下兼容，除非您知道自己在做什么，否则不要使用该版本。

            - 提交：${{ github.sha }}
          files: |
            ./output-linux-deb-*/*.deb
            ./output-linux-zip-*/*.zip
            ./output-windows-*/*.zip
