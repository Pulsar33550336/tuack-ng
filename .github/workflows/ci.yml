name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-2025
            platform: windows-x86_64
          - runner: windows-11-arm
            platform: windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.platform }}
          # PR 只读缓存，只有合进 master 的构建才写
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build
        run: cargo build --workspace --locked

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  lint-commits:
    name: lint commits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build xtask
        run: cargo build --locked -p tuack-xtask

      - name: Check commit messages (pull request)
        if: github.event_name == 'pull_request'
        run: cargo xtask commit-msg --range "${{ github.event.pull_request.base.sha }}..HEAD"

      - name: Check commit messages (push)
        if: github.event_name == 'push'
        run: cargo xtask commit-msg --range "${{ github.event.before }}..HEAD"
