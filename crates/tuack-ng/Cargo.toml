[package]
name = "tuack-ng"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "重构后的 tuack 项目，旨在提供更加高效和轻量的出题体验。"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "tuack-ng"

[dependencies]
anstream.workspace = true
anyhow.workspace = true
bytesize.workspace = true
cel-interpreter = { version = "0.10.0", default-features = false }
chrono = "0.4.45"
clap.workspace = true
clap-i18n-richformatter = { version = "0.3.2", features = ["derive"] }
clap_complete = "4.6.11"
codespan-reporting = "0.13.1"
csv = "1.4.0"
dialoguer = "0.12.0"
dirs = "7.0.0"
dunce.workspace = true
indexmap.workspace = true
indicatif = "0.18.6"
indicatif-log-bridge = "0.2.3"
log.workspace = true
log4rs = "1.4.0"
natord = "1.0.9"
opener = "0.9.0"
owo-colors.workspace = true
path-slash = "0.2.1"
rand = "0.10.3"
regex.workspace = true
semver = "1.0.28"
serde.workspace = true
serde_json.workspace = true
serde_many.workspace = true
sha2 = "0.11.1"
sysinfo.workspace = true
tempfile.workspace = true
termcolor = "1.4.1"
unicode-width = "0.2.2"
ureq = "3.5.0"
zip.workspace = true

[dependencies.tuack-ng-parser]
workspace = true

[dependencies.tuack-lib]
workspace = true

[dependencies.tuack-config]
workspace = true

[dependencies.tuack-utils]
workspace = true

[build-dependencies]
vergen = { version = "10.0.3", features = [
    "build",
    "cargo",
    "cargo_metadata",
    "rustc",
    "si",
] }

[features]
nix = []

[package.metadata.deb]
assets = [
    ["../../target/dist/tuack-ng", "usr/bin/", "755"],
    ["../../target/dist/assets/**/*", "usr/share/tuack-ng/", "755"],
]
maintainer-scripts = "../../doc/debian/"
license-file = ["../../doc/debian/copyright", "0"]
depends = "libc6 (>= 2.28)"

[package.metadata.deb.variants.glibc_2_17]
name = "tuack-ng"
depends = "libc6 (>= 2.17)"

[package.metadata.deb.variants.glibc_2_28]
name = "tuack-ng"
depends = "libc6 (>= 2.28)"

[package.metadata.deb.variants.glibc_2_31]
name = "tuack-ng"
depends = "libc6 (>= 2.31)"

[package.metadata.aur]
files = [["../../assets/", "/usr/share/tuack-ng/", "755"]]
depends = ["gcc-libs", "glibc"]
